name: Publish Banzhi AI Tools Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified static release
        run: |
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0 Chrome/130.0.0.0 Safari/537.36' 'https://shukan-toolkit.delacruzjhon484.chatgpt.site/banzhi-pages-v38.zip' -o /tmp/release.zip
          echo '63cca9742fd05166b3c45bbc4eaf1a882bc2ba3e01d1bc7e7a32d72a5e4fb19e  /tmp/release.zip' | sha256sum --check
          unzip -q /tmp/release.zip -d source
      - name: Sync public index snapshots
        working-directory: source
        run: python3 scripts/sync-news.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp -R source/. _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
